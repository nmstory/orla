version: "3.9"

services:
  controller:
    build: .
    image: orla:latest
    container_name: controller
    environment:
      ROLE: controller
      PORT: 4000
      MAX_LATENCY_MS: 100
      LOSS_RATE: 0.1
      REORDER_PROB: 0.05
      PROMETHEUS_PORT: 9100
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - orla_net
    expose:
      - "4000/udp"
      - "9100/tcp"
    ports:
      - "4000:4000/udp"

  edge:
    image: orla:latest
    environment:
      ROLE: edge
      PORT: 4001
      MAX_LATENCY_MS: 100
      LOSS_RATE: 0.1
      REORDER_PROB: 0.05
      CONTROLLER_ADDR: controller
      PROMETHEUS_PORT: 9101
    labels:
      orla.role: edge
    networks:
      - orla_net
    expose:
      - "4001/udp"
      - "9101/tcp"

  client:
    image: orla:latest
    container_name: client
    environment:
      ROLE: client
      PORT: 4003
      MAX_LATENCY_MS: 100
      LOSS_RATE: 0.1
      REORDER_PROB: 0.05
      CONTROLLER_ADDR: controller
    networks:
      - orla_net
    expose:
      - "4003/udp"

  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: dockerproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
    networks:
      - orla_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - orla_net
    depends_on:
      - dockerproxy

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - orla_net
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks:
      - orla_net

networks:
  orla_net:
    driver: bridge

volumes:
  grafana_data:
